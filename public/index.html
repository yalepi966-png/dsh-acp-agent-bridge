<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外部 Agent 桥</title>
<style>
  :root {
    color-scheme: light;
    --ink: #3f4a63;
    --ink-soft: #6b7488;
    --ink-faint: #98a1b3;
    --glass: rgba(255, 255, 255, 0.6);
    --glass-strong: rgba(255, 255, 255, 0.78);
    --line: rgba(255, 255, 255, 0.85);
    --line-soft: rgba(196, 208, 226, 0.55);
    --mint-ink: #2f7a58;
    --shadow: 0 10px 28px rgba(120, 132, 160, 0.12);
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    padding: clamp(10px, 2.2vw, 20px) clamp(10px, 2.4vw, 22px) 20px;
    font: 400 12.5px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(52vw 52vw at 6% -12%, #dff1ff 0%, rgba(223, 241, 255, 0) 62%),
      radial-gradient(46vw 46vw at 98% 2%, #efe3ff 0%, rgba(239, 227, 255, 0) 60%),
      radial-gradient(42vw 42vw at 74% 98%, #ffe7dd 0%, rgba(255, 231, 221, 0) 58%),
      radial-gradient(36vw 36vw at 14% 94%, #e2fbf0 0%, rgba(226, 251, 240, 0) 62%),
      #f7f9fd;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: min(940px, 100%);
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 9px;
    align-items: stretch;
  }

  .top { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-bottom: 2px; }
  h1 { margin: 0; font-size: clamp(16px, 2.2vw, 19px); font-weight: 600; letter-spacing: 0.02em; }
  .sub { margin: 2px 0 0; font-size: 10.5px; color: var(--ink-faint); overflow-wrap: anywhere; }
  .top-right { display: flex; align-items: center; gap: 6px; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 10.5px; font-weight: 500; white-space: nowrap;
    background: var(--glass-strong); border: 1px solid var(--line);
    box-shadow: 0 4px 12px rgba(120, 132, 160, 0.10);
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); }
  .pill.is-off .dot { background: #c3cad8; }

  .card {
    min-width: 0;
    background: var(--glass);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 11px 13px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
  }
  #port-card { grid-column: 1 / -1; }
  #cards { display: contents; }

  .card-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head-right { display: flex; align-items: center; gap: 7px; }

  .chip {
    display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600; white-space: nowrap;
  }
  .chip.ready { background: linear-gradient(135deg, #d8f7e8, #c6f0dd); color: var(--mint-ink); }
  .chip.off { background: #eef1f6; color: #7d8698; }
  .chip.bad { background: linear-gradient(135deg, #ffe4e4, #ffd6da); color: #b45860; }

  .switch {
    position: relative; width: 38px; height: 22px; padding: 0; flex: none;
    border: 0; border-radius: 999px; cursor: pointer;
    background: #e4e8f0; transition: background 0.22s ease;
    box-shadow: inset 0 1px 2px rgba(80, 90, 120, 0.12);
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(90, 100, 130, 0.22);
    transition: transform 0.22s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .switch[aria-checked="true"] { background: linear-gradient(135deg, #8fe3c0, #79d7b1); }
  .switch[aria-checked="true"]::after { transform: translateX(16px); }
  .switch:focus-visible { outline: 2px solid #a9c9ff; outline-offset: 2px; }

  .summary { margin: 4px 0 0; font-size: 11px; color: var(--ink-soft); overflow-wrap: anywhere; }

  .field { margin-top: 8px; display: grid; gap: 3px; }
  .label { font-size: 10.5px; color: var(--ink-faint); letter-spacing: 0.02em; }
  .input {
    width: 100%; min-width: 0; padding: 6px 9px; font: inherit; font-size: 11.5px; color: var(--ink);
    background: var(--glass-strong); border: 1px solid var(--line-soft);
    border-radius: 10px; outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .input::placeholder { color: #b3bbc9; }
  .input:focus { border-color: #b9d4f6; box-shadow: 0 0 0 3px rgba(185, 212, 246, 0.26); }

  .hint { margin: 0; font-size: 10px; line-height: 1.5; color: var(--ink-faint); overflow-wrap: anywhere; }

  .adapter {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center; gap: 6px; margin-top: 6px;
  }
  .adapter-name { font-size: 10px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn.small { padding: 3px 9px; font-size: 10.5px; }

  .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .btn {
    padding: 5px 11px; font: inherit; font-size: 11.5px; color: #55607a; cursor: pointer;
    background: var(--glass-strong); border: 1px solid var(--line-soft);
    border-radius: 999px; white-space: nowrap;
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(120, 132, 160, 0.14); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }
  .btn.primary {
    color: #3c4a66; border-color: transparent;
    background: linear-gradient(135deg, #cfe8ff, #e2d9ff);
    box-shadow: 0 5px 14px rgba(150, 170, 220, 0.20);
  }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-faint); }

  .status { font-size: 10.5px; color: var(--ink-faint); }

  .port-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }

  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 12px);
    padding: 7px 14px; font-size: 11.5px; color: #48536b;
    background: rgba(255, 255, 255, 0.88); border: 1px solid var(--line);
    border-radius: 999px; box-shadow: 0 10px 26px rgba(120, 132, 160, 0.18);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    opacity: 0; pointer-events: none; transition: opacity 0.22s ease, transform 0.22s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 640px) {
    .top { grid-template-columns: minmax(0, 1fr); }
    .port-row { grid-template-columns: minmax(0, 1fr) auto auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <h1>外部 Agent 桥</h1>
        <p class="sub" id="config-path">正在读取配置…</p>
      </div>
      <div class="top-right">
        <span class="pill" id="overall"><span class="dot"></span><span id="overall-text">加载中</span></span>
        <button class="btn" id="probe">重新探测</button>
      </div>
    </header>

    <section class="card" id="port-card">
      <div class="card-head">
        <span class="name">服务端口</span>
        <span class="chip off" id="port-current">当前 4319</span>
      </div>
      <p class="summary">换端口会就地重启服务，不需要重启应用。</p>
      <div class="field">
        <label class="label" for="port-input">端口（1–65535）</label>
        <div class="port-row">
          <input class="input" id="port-input" inputmode="numeric" placeholder="4319">
          <button class="btn" id="port-check">检测</button>
          <button class="btn primary" id="port-apply">确定</button>
        </div>
        <p class="hint" id="port-status"></p>
      </div>
    </section>

    <div id="cards"></div>

  </main>

  <div class="toast" id="toast" role="status"></div>

<script>
let base = localStorage.getItem('agent-bridge-base') || location.origin
const toast = (message) => {
  const node = document.getElementById('toast')
  node.textContent = message
  node.classList.add('show')
  clearTimeout(toast.timer)
  toast.timer = setTimeout(() => node.classList.remove('show'), 2000)
}

const api = async (path, init) => {
  const response = await fetch(base + path, init)
  const body = await response.json()
  if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`)
  return body
}

const el = (tag, className, text) => {
  const node = document.createElement(tag)
  if (className) node.className = className
  if (text !== undefined) node.textContent = text
  return node
}

const adapterBlock = (agent) => {
  const adapter = agent.adapter || {}
  const wrap = el('div', 'adapter')
  const full = adapter.package || agent.adapterPackage
  const short = full.split('/').pop()
  const label = el('span', 'adapter-name', `ACP ${short} ${adapter.pinned || ''}`.trim())
  label.title = full

  const status = el('span', `chip ${adapter.ready ? 'ready' : 'off'}`, adapter.ready
    ? (adapter.source === 'config' ? '自定义' : `已安装${adapter.version ? ` · ${adapter.version}` : ''}`)
    : (adapter.install?.status === 'installing' ? '安装中…' : '未安装'))

  wrap.append(label, status)

  if (!adapter.ready || adapter.install?.status === 'error') {
    const button = el('button', 'btn small', adapter.install?.status === 'error' ? '重试安装' : '安装')
    button.onclick = async () => {
      button.disabled = true
      button.textContent = '安装中…'
      try {
        await api(`/api/adapters/${agent.id}/install`, { method: 'POST' })
        for (;;) {
          await new Promise(resolve => setTimeout(resolve, 2000))
          const progress = await api(`/api/adapters/${agent.id}`)
          if (progress.install?.status === 'done' || progress.install?.status === 'error') {
            if (progress.install.status === 'error') toast(progress.install.error || '安装失败')
            else toast('适配器已安装')
            await load()
            return
          }
        }
      } catch (error) {
        button.disabled = false
        button.textContent = '安装'
        toast(error.message)
      }
    }
    wrap.append(button)
  }

  if (adapter.install?.status === 'error') {
    wrap.append(el('p', 'hint', adapter.install.error || '安装失败'))
  }
  return wrap
}

const cardFor = (agent) => {
  const card = el('section', 'card')
  const head = el('div', 'card-head')
  head.append(el('span', 'name', agent.label))

  const right = el('div', 'head-right')
  const usable = agent.enabled && agent.detection.available
  const chip = el('span', `chip ${agent.detection.available ? (usable ? 'ready' : 'off') : 'bad'}`,
    agent.detection.available ? (usable ? '可以使用' : '已关闭') : '不可用')
  const toggle = el('button', 'switch')
  toggle.setAttribute('role', 'switch')
  toggle.setAttribute('aria-checked', String(agent.enabled))
  toggle.setAttribute('aria-label', `${agent.label} 开关`)
  toggle.onclick = () => save(agent.id, { enabled: !agent.enabled })
  right.append(chip, toggle)
  head.append(right)

  const summary = el('p', 'summary', agent.detection.available
    ? (usable
        ? `已开启，模型可以用 ask_${agent.id} 把任务派给它。`
        : `已检测到 ${agent.detection.version || 'CLI'}，但开关关着，模型暂时用不了。`)
    : `没有找到可用的 CLI：${agent.detection.reason || '未知原因'}。在下面填绝对路径可以手动指定。`)

  const field = el('div', 'field')
  field.append(el('label', 'label', agent.command === '' ? 'CLI 路径（自动探测）' : 'CLI 路径（手动指定）'))
  const input = el('input', 'input')
  input.value = agent.command || agent.detection.path || ''
  input.placeholder = agent.effectiveCommand
  field.append(input)
  field.append(el('p', 'hint', agent.command === ''
    ? '自动探测 · 每次启动重新解析'
    : '固定路径 · 清空并保存可恢复自动'))
  field.append(adapterBlock(agent))

  const actions = el('div', 'actions')
  const saveButton = el('button', 'btn primary', '保存')
  saveButton.onclick = () => save(agent.id, { command: input.value })
  actions.append(saveButton)
  if (agent.command !== '') {
    const reset = el('button', 'btn ghost', '恢复自动')
    reset.onclick = () => save(agent.id, { command: '' })
    actions.append(reset)
  }

  card.append(head, summary, field, actions)
  return card
}

const render = (state) => {
  document.getElementById('config-path').textContent = `配置：${state.configPath}`
  const ready = state.agents.filter(agent => agent.enabled && agent.detection.available)
  const overall = document.getElementById('overall')
  overall.classList.toggle('is-off', ready.length === 0)
  document.getElementById('overall-text').textContent = ready.length > 0
    ? `已启用 ${ready.length} 个`
    : '未启用'

  document.getElementById('port-current').textContent = `当前 ${state.port}`
  document.getElementById('port-input').value = state.port

  const cards = document.getElementById('cards')
  cards.replaceChildren(...state.agents.map(cardFor))
}

const load = async () => {
  try {
    render(await api('/api/state'))
  } catch (error) {
    document.getElementById('config-path').textContent = `读取失败：${error.message}`
  }
}

const save = async (id, patch) => {
  try {
    render(await api(`/api/agents/${id}`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(patch),
    }))
    toast('已保存')
  } catch (error) {
    toast(error.message)
  }
}

const checkPort = async () => {
  const port = Number(document.getElementById('port-input').value)
  try {
    const result = await api(`/api/port?port=${port}`)
    document.getElementById('port-status').textContent = result.current
      ? `端口 ${result.port} 是当前端口`
      : result.free ? `端口 ${result.port} 空闲` : `端口 ${result.port} 已被占用`
  } catch (error) {
    document.getElementById('port-status').textContent = error.message
  }
}

const applyPort = async () => {
  const port = Number(document.getElementById('port-input').value)
  try {
    const result = await api('/api/port', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ port }),
    })
    if (result.pageUrl) {
      base = result.pageUrl.replace(/\/$/, '')
      localStorage.setItem('agent-bridge-base', base)
    }
    render(result)
    document.getElementById('port-status').textContent = `已切换：${base}`
    toast('端口已切换')
  } catch (error) {
    document.getElementById('port-status').textContent = error.message
  }
}

document.getElementById('port-check').onclick = checkPort
document.getElementById('port-apply').onclick = applyPort
document.getElementById('probe').onclick = async (event) => {
  const button = event.currentTarget
  button.disabled = true
  button.textContent = '探测中…'
  try {
    render(await api('/api/probe', { method: 'POST' }))
    toast(`已重新探测 · ${new Date().toLocaleTimeString()}`)
  } catch (error) {
    toast(error.message)
  } finally {
    button.disabled = false
    button.textContent = '重新探测'
  }
}

api('/api/state').then(render).catch((error) => {
  document.getElementById('config-path').textContent = `读取失败：${error.message}`
})
</script>
</body>
</html>
